<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">

        "imports": {
          "react": "https://esm.sh/react@19.2.8",
          "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@19.2.8/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@19.2.8",
          "react-dom/client": "https://esm.sh/react-dom@19.2.8/client",
          "leaflet": "https://esm.sh/leaflet@1.9.4"
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fit My Truck helps contractors and service fleets compare truck capability, range, towing, payload, charging, and operating cost." />
    <meta name="theme-color" content="#0f2a24" />
    <title>Fit My Truck</title>
    <link id="fit-my-truck-leaflet-css" rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <script type="module">
      const cssParts = ['./assets/index-DO007ApE.part0', './assets/index-DO007ApE.part1', './assets/index-DO007ApE.part2'];
      const jsParts = ['./assets/index-BtYym_T3.part0', './assets/index-BtYym_T3.part1', './assets/index-BtYym_T3.part2', './assets/index-BtYym_T3.part3', './assets/index-BtYym_T3.part4', './assets/index-BtYym_T3.part5', './assets/index-BtYym_T3.part6', './assets/index-BtYym_T3.part7', './assets/index-BtYym_T3.part8', './assets/index-BtYym_T3.part9', './assets/index-BtYym_T3.part10', './assets/index-BtYym_T3.part11'];
      const [cssSources, jsSources] = await Promise.all([
        Promise.all(cssParts.map(async (url) => {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Failed to load " + url);
          return response.text();
        })),
        Promise.all(jsParts.map(async (url) => {
          const response = await fetch(url);
          if (!response.ok) throw new Error("Failed to load " + url);
          return response.text();
        })),
      ]);
      const style = document.createElement("style");
      style.textContent = cssSources.join("");
      document.head.appendChild(style);
      await import(URL.createObjectURL(new Blob(jsSources, { type: "text/javascript" })));
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
