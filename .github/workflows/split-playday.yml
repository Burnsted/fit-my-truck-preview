name: Split Play Day preview JS parts

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_src/**"
      - ".github/workflows/split-playday.yml"

permissions:
  contents: write

concurrency:
  group: split-playday
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split JS parts and flip live HTML
        run: |
          python3 << 'PY'
          from pathlib import Path
          import json
          src_dir = Path("assets/_src")
          pieces = sorted(src_dir.glob("index-CE6fUd-V.part*"), key=lambda p: int(p.name.split("part")[-1]))
          if not pieces:
              pieces = [src_dir / "index-CE6fUd-V.js"] if (src_dir / "index-CE6fUd-V.js").exists() else []
          if not pieces:
              raise SystemExit("missing assets/_src JS parts")
          js = b"".join(p.read_bytes() for p in pieces)
          if b"Fishing boat" not in js:
              raise SystemExit("patched JS missing Play Day catalog")
          part = 25600
          n = (len(js) + part - 1) // part
          stem = "index-CE6fUd-V"
          assets = Path("assets")
          written = []
          for i in range(n):
              chunk = js[i * part:(i + 1) * part]
              dest = assets / f"{stem}.part{i}"
              dest.write_bytes(chunk)
              written.append(f"./assets/{stem}.part{i}")
              print("part", dest.name, len(chunk))
          css_src = src_dir / "index-DRm4TlEf.css"
          if css_src.exists():
              (assets / "index-DRm4TlEf.css").write_bytes(css_src.read_bytes())
          part_list = ",\n        ".join(json.dumps(p) for p in written)
          html = f"""<!doctype html>\n<html lang=\"en\">\n  <head>\n    <script type=\"importmap\">\n      {{\n        \"imports\": {{\n          \"react\": \"https://esm.sh/react@19.2.8\",\n          \"react/jsx-runtime\": \"https://esm.sh/react@19.2.8/jsx-runtime\",\n          \"react/jsx-dev-runtime\": \"https://esm.sh/react@19.2.8/jsx-dev-runtime\",\n          \"react-dom\": \"https://esm.sh/react-dom@19.2.8\",\n          \"react-dom/client\": \"https://esm.sh/react-dom@19.2.8/client\"\n        }}\n      }}\n    </script>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n    <title>Fit My Truck</title>\n    <link rel=\"stylesheet\" crossorigin href=\"./assets/index-DRm4TlEf.css\">\n    <script type=\"module\">\n      const parts = [\n        {part_list}\n      ];\n      const sources = await Promise.all(\n        parts.map(async (url) => {{\n          const response = await fetch(url);\n          if (!response.ok) throw new Error(`Failed to load ${{url}}`);\n          return response.text();\n        }}),\n      );\n      await import(URL.createObjectURL(new Blob(sources, {{ type: \"text/javascript\" }})));\n    </script>\n  </head>\n  <body>\n    <div id=\"root\"></div>\n  </body>\n</html>\n"""
          Path("index.html").write_text(html)
          Path("404.html").write_text(html)
          Path("README.md").write_text("""# Fit My Truck — public web preview\n\nShareable HTTPS demo of [Fit My Truck](https://github.com/Burnsted/fit-my-truck).\n\n**Open on a phone (no login):** https://burnsted.github.io/fit-my-truck-preview/\n\nThis preview is from **PR #14** branch `cursor/year-photos-wheels-2b74` (`4ec4bbe0e41fef35ca8485a7b098fb8bef4f11e1`) for Ted’s review — **not merged to `main`**.\n\nIncludes Play Day recreational towables and activity gear. Year photos load from Wikimedia Commons. App JS is published as text parts.\n""")
          print("html flipped", n, "parts", len(js))
          PY
      - name: Commit split parts and HTML
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-CE6fUd-V.part* assets/index-DRm4TlEf.css index.html 404.html README.md
          if git diff --cached --quiet; then
            echo "parts already current"
          else
            git commit -m "Materialize Play Day PR14 JS parts (index-CE6fUd-V)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
