name: Cleanup stale preview assets

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_fix/CLEANUP"
      - ".github/workflows/cleanup-stale.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-stale
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale PR9 assets and 2KB slice staging
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f assets/index-B-a-4Wxy.part* \
                assets/index-DKD9Pd2A.css \
                assets/_binprobe.txt \
                assets/index-cb98404a.part* \
                assets/index-e8d7c5b3.part*
          rm -rf assets/_asm
          git add -A -- assets .github/workflows
          if git diff --cached --quiet; then
            echo "nothing to clean"
          else
            git commit -m "Remove stale PR9 assets, leftover 80KB parts, and 2KB slice staging"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
