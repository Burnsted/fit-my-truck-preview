name: Pack 80KB JS parts

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_fix/PACK80"
      - ".github/workflows/pack-80kb-parts.yml"

permissions:
  contents: write

concurrency:
  group: pack-80kb-parts
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate exact 25KB parts into 80KB parts
        run: |
          python3 << 'PY'
          import hashlib, pathlib

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()

          expected = {
            0: ("c42fddaadb2173eca50ea7b174cfadf22f368e13", 81920),
            1: ("4f76d7ac1ea3880adde75bbf3056bc664dba4494", 81920),
            2: ("aa233aafbc76ab764925ae26475ad910e40b8414", 81920),
            3: ("965506b8ed1f48032f19531dc257ee9eb1fe0e93", 81920),
            4: ("8c512ac7cdd9903b1b4ddd4a1762784d6e8995cd", 81920),
            5: ("a30f0534e154093c00bdd4b4cae0495facb5ec99", 81920),
            6: ("bb2b12793fb6effb4d5d0fd399682870d7741bb4", 81920),
            7: ("00e2b94c92a4cd7831404d62d726cffd2e5f4762", 81920),
            8: ("ee13e6c6e82246d569e75887c348b7d7d3d0887f", 81920),
            9: ("c62949ac0edff1cca591d7e11195c85a29e304fd", 81920),
            10: ("92e052f2137162371fa30b5c1c26a719f1c218aa", 81920),
            11: ("234e377cbdf96c1cb47205b6e4fe269119bc48c6", 81920),
            12: ("e625018cbe07106c426c32d7fc7343191eea0bc9", 81920),
            13: ("21636cceaee71b9c869b2b72f149de94756d4b71", 81920),
            14: ("b29a8a50860819f0baccbf369c1c10e9ce644431", 81920),
            15: ("04b1e2cc79dec84d4a664ca87209aedfe2736fd7", 81920),
            16: ("63b8e7a94d6b6477b5613f379197cb35c0483362", 81920),
            17: ("85857492769fbc6009c77e66ca833e4f12af6d3d", 30382),
          }
          buf = bytearray()
          for i in range(56):
              p = pathlib.Path(f"assets/index-cb98404ab.part{i}")
              if not p.exists():
                  raise SystemExit(f"missing {p}")
              buf.extend(p.read_bytes())
          print("concat size", len(buf))
          off = 0
          for i, (want_sha, want_size) in expected.items():
              piece = bytes(buf[off:off + want_size])
              off += want_size
              sha = blob_sha(piece)
              if len(piece) != want_size or sha != want_sha:
                  raise SystemExit(f"part{i} size={len(piece)} sha={sha} want {want_size} {want_sha}")
              dest = pathlib.Path(f"assets/index-cb98404a.part{i}")
              dest.write_bytes(piece)
              print("ok", dest.name, want_size, sha)
          if off != len(buf):
              raise SystemExit(f"leftover {len(buf) - off} bytes")
          PY
      - name: Commit 80KB parts only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-cb98404a.part*
          if git diff --cached --quiet; then
            echo "80KB parts already exact"
          else
            git commit -m "Add 80KB inlined-photo JS parts (index-cb98404a) from exact 25KB parts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
