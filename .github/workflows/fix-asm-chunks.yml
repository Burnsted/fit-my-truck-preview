name: Fix assembler JS chunks

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_asm/fixes.json"
      - "assets/_asm/expected.json"
      - "assets/_asm/*.s*"
      - ".github/workflows/fix-asm-chunks.yml"

permissions:
  contents: write

concurrency:
  group: fix-asm-chunks
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concat slices, apply patches, verify chunk SHAs
        run: |
          python3 << 'PY'
          import json, hashlib, re
          from collections import defaultdict
          from pathlib import Path

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()

          def apply_fixes(asm: Path) -> None:
              fix_path = asm / "fixes.json"
              if not fix_path.exists():
                  return
              for fix in json.loads(fix_path.read_text()):
                  p = asm / fix["path"]
                  if not p.exists():
                      print(f"skip missing fix target {p}")
                      continue
                  current = p.read_bytes()
                  if blob_sha(current) == fix["expected_sha"]:
                      print(f"already ok {p}")
                      continue
                  b = bytearray(current)
                  for op in fix["ops"]:
                      kind = op["op"]
                      if kind == "replace":
                          off = op["offset"]
                          old = op["old"].encode("ascii")
                          new = op["new"].encode("ascii")
                          got = bytes(b[off:off+len(old)])
                          if got != old:
                              raise SystemExit(f"{p} replace @{off}: got {got!r} want {old!r}")
                          b[off:off+len(old)] = new
                      elif kind == "delete":
                          del b[op["offset"]:op["offset"]+op["length"]]
                      elif kind == "truncate":
                          b = bytearray(bytes(b)[:op["length"]])
                      else:
                          raise SystemExit(f"unknown op {kind}")
                  data = bytes(b)
                  sha = blob_sha(data)
                  if sha != fix["expected_sha"]:
                      raise SystemExit(f"{p} sha {sha} != {fix['expected_sha']}")
                  p.write_bytes(data)
                  print(f"fixed {p} sha={sha} size={len(data)}")

          asm = Path("assets/_asm")
          apply_fixes(asm)
          slices = defaultdict(list)
          for p in asm.iterdir():
              m = re.fullmatch(r"(p\d+\.c\d+)\.s(\d+)", p.name)
              if m:
                  slices[m.group(1)].append((int(m.group(2)), p))
          for chunk, parts in slices.items():
              parts.sort()
              data = b"".join(fp.read_bytes() for _, fp in parts)
              (asm / chunk).write_bytes(data)
              print(f"concat {chunk} slices={len(parts)} size={len(data)}")
          apply_fixes(asm)

          expected = json.loads((asm / "expected.json").read_text())
          for name, info in expected.items():
              p = asm / name
              if not p.exists():
                  print(f"missing {name}")
                  continue
              data = p.read_bytes()
              if len(data) != info["size"]:
                  print(f"incomplete {name} {len(data)}/{info['size']}")
                  continue
              sha = blob_sha(data)
              if sha != info["sha"]:
                  raise SystemExit(f"SHA mismatch {name} {sha} != {info['sha']}")
              print(f"ok {name} sha={sha} size={len(data)}")
          PY
      - name: Commit assembled chunks
        run: |
          git config user.name "Burnsted"
          git config user.email "coachted14@gmail.com"
          git add -A -- assets/_asm
          if git diff --cached --quiet; then
            echo "no chunk changes"
          else
            git commit -m "Assemble verified JS chunks from slices"
            git push origin HEAD:main
          fi
