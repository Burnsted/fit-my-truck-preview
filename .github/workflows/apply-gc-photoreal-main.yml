name: Apply GC photoreal to main
on:
  push:
    branches: [main]
    paths:
      - "assets/_b64_chunks/gc_b64_*.txt"
      - ".github/workflows/apply-gc-photoreal-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble photoreal GC JPG from b64 parts
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib
          from pathlib import Path
          parts = sorted(Path("assets/_b64_chunks").glob("gc_b64_*.txt"))
          assert parts, "missing gc_b64_*.txt"
          data = base64.b64decode("".join(p.read_text().strip() for p in parts))
          md5 = hashlib.md5(data).hexdigest()
          assert md5 == "6e11253972abb457f8a26e8a76261503", md5
          assert len(data) == 359685, len(data)
          for t in [
              Path("assets/workday-trade-general-contractor-01Q32nWx.jpg"),
              Path("staging-simplify/assets/workday-trade-general-contractor-01Q32nWx.jpg"),
              Path("staging-feedback/assets/workday-trade-general-contractor-01Q32nWx.jpg"),
          ]:
              t.parent.mkdir(parents=True, exist_ok=True)
              t.write_bytes(data)
              print("wrote", t, len(data), md5)
          for js_name in ("index-JjLgFaCi.js", "index-YjYaDdGR.js"):
              js = Path("assets") / js_name
              if js.exists():
                  assert "workday-trade-general-contractor-01Q32nWx.jpg" in js.read_text()
                  print(js_name, "ok")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workday-trade-general-contractor-01Q32nWx.jpg \
                  staging-simplify/assets/workday-trade-general-contractor-01Q32nWx.jpg \
                  staging-feedback/assets/workday-trade-general-contractor-01Q32nWx.jpg
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "fix(assets): live photoreal meal-free GC plate (keep FleetFit JS hashes)"
            git push
          fi
