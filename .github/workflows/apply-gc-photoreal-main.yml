# GC trade plate gate (friend preview).
# Ted redline 2026-10-06: live GC card must use REAL production EV photos
# (Chevy Silverado EV + Ford F-150 Lightning), not CGI / synthetic plates.
# Do NOT re-pull the old catbox CGI (MD5 6e112539...) or merge fit-my-truck PR #37.
name: Verify GC real-photo plate
on:
  push:
    branches: [main]
    paths:
      - "assets/workday-trade-general-contractor-01Q32nWx.jpg"
      - "staging-simplify/assets/workday-trade-general-contractor-01Q32nWx.jpg"
      - "staging-feedback/assets/workday-trade-general-contractor-01Q32nWx.jpg"
      - ".github/workflows/apply-gc-photoreal-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assert live GC JPG is real-photo EV duo (not CGI)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          from pathlib import Path
          # Real Commons photos (same catalog sources FleetFit already credits):
          # - 2024 Chevrolet Silverado EV 4WT (Elise240SX, CC BY-SA 4.0)
          # - 2022 Ford F-150 Lightning Lariat (Elise240SX, CC BY-SA 4.0)
          EXPECTED_MD5 = "45f15d634784ec1ceb332d490574795d"
          CGI_REJECT = "6e11253972abb457f8a26e8a76261503"
          paths = [
              Path("assets/workday-trade-general-contractor-01Q32nWx.jpg"),
              Path("staging-simplify/assets/workday-trade-general-contractor-01Q32nWx.jpg"),
              Path("staging-feedback/assets/workday-trade-general-contractor-01Q32nWx.jpg"),
          ]
          for p in paths:
              data = p.read_bytes()
              md5 = hashlib.md5(data).hexdigest()
              assert md5 != CGI_REJECT, f"{p} still CGI plate {md5}"
              assert md5 == EXPECTED_MD5, f"{p} md5 {md5} != {EXPECTED_MD5}"
              assert data[:3] == b"\xff\xd8\xff", f"{p} not jpeg"
              print("ok", p, len(data), md5)
          for js_name in ("index-JjLgFaCi.js", "index-YjYaDdGR.js"):
              js = Path("assets") / js_name
              if js.exists():
                  assert "workday-trade-general-contractor-01Q32nWx.jpg" in js.read_text()
                  print(js_name, "pointer ok")
          PY
