name: Assemble JS bundle
on:
  push:
    paths:
      - 'assets/_js_upload/**'
      - '.github/workflows/assemble-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate JS parts
        run: |
          cat assets/_js_upload/part{0..10} > assets/index-C5OeA6xn.js
          echo "Assembled size: $(wc -c < assets/index-C5OeA6xn.js) bytes"
      - name: Commit assembled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/index-C5OeA6xn.js
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Deploy complete Vite assets (CSS + JS bundle)"
          git push
