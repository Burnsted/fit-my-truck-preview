name: Assemble JS bundle

on:
  push:
    branches:
      - main
    paths:
      - 'assets/index-C0yDz0UG.part*'
      - '.github/workflows/assemble-js.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate JS parts into single bundle
        run: |
          cat assets/index-C0yDz0UG.part{0..14} > assets/index-C0yDz0UG.js
          SIZE=$(wc -c < assets/index-C0yDz0UG.js)
          echo "Assembled size: ${SIZE} bytes"
          test "${SIZE}" -ge 250000
      - name: Commit assembled bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/index-C0yDz0UG.js
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Assemble complete index-C0yDz0UG.js from part0–part14"
          git pull --rebase origin main
          git push origin main
