name: Assemble JS bundle

on:
  push:
    paths:
      - assets/index-BvE-znnG.part*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cat JS parts into bundle
        run: cat assets/index-BvE-znnG.part0 assets/index-BvE-znnG.part1 assets/index-BvE-znnG.part2 assets/index-BvE-znnG.part3 > assets/index-BvE-znnG.js
      - name: Commit assembled bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add assets/index-BvE-znnG.js
          git diff --staged --quiet && echo "No changes" || (git commit -m "chore: assemble index-BvE-znnG.js" && git push)
