name: Clean dist rebuild
# trigger: reassemble play-day images + interior, 102 parts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/clean-rebuild.yml"

permissions:
  contents: write

concurrency:
  group: clean-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble split text parts, clean up legacy files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The app JS bundle was pushed as many small ASCII-safe
          # "<name>.partNNN" plain-text fragments over the text-only Contents
          # API (each part is exact UTF-8 source text, no encoding tricks).
          # Reassemble each family of parts (sorted lexically, so part001 <
          # part002 < ...) back into the real file, then drop the parts.
          find . -path ./.git -prune -o -name '*.part[0-9]*' -print | \
            sed -E 's/\.part[0-9]+$//' | sort -u | while read -r target; do
              : > "$target"
              for part in $(find . -path ./.git -prune -o -name "$(basename "$target").part[0-9]*" -print | sort); do
                cat "$part" >> "$target"
                rm -f "$part"
              done
            done

          test -f index.html
          test -f 404.html
          test -n "$(find assets -maxdepth 1 -name 'index-*.js' 2>/dev/null)"
          test -f vendor/leaflet/leaflet.css

          # Sanity check: the reassembled JS must be syntactically valid.
          node --check assets/index-*.js

          # Drop anything not part of the fresh manifest (old chunked-upload
          # wreckage, orphaned hashed modules, one-off patch files, etc).
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              index.html|404.html|.nojekyll|README.md) ;;
              assets/*|vendor/leaflet/*) ;;
              .github/workflows/clean-rebuild.yml) ;;
              *) git rm -q --ignore-unmatch -- "$f" ;;
            esac
          done

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Clean rebuild: reassemble text parts, drop legacy files"
            git push origin HEAD:main
          fi
