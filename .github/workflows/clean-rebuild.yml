name: Clean dist rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/clean-rebuild.yml"

permissions:
  contents: write

concurrency:
  group: clean-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode base64 sidecars into real binary files, drop legacy files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A text-only push (Contents API) cannot carry raw binary bytes, so
          # binary assets land as ASCII-safe "<name>.b64" sidecars. Decode
          # each one back into the real file, then drop the sidecar.
          find . -path ./.git -prune -o -name '*.b64' -print | while read -r f; do
            target="${f%.b64}"
            base64 -d "$f" > "$target"
            rm "$f"
          done

          test -f index.html
          test -f 404.html
          test -n "$(find assets -maxdepth 1 -name 'index-*.js' 2>/dev/null)"
          test -n "$(find assets -maxdepth 1 -name '*.jpg' 2>/dev/null)"
          test -f vendor/leaflet/leaflet.css
          test -f vendor/leaflet/images/marker-icon.png

          # Drop anything not part of the fresh manifest (old chunked-upload
          # wreckage, orphaned hashed modules, one-off patch files, etc).
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              index.html|404.html|.nojekyll|README.md) ;;
              assets/*|vendor/leaflet/*) ;;
              .github/workflows/clean-rebuild.yml) ;;
              *) git rm -q --ignore-unmatch -- "$f" ;;
            esac
          done

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Clean rebuild: decode binaries, drop legacy chunked-upload files"
            git push origin HEAD:main
          fi
