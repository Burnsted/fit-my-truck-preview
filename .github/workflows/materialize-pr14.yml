name: Materialize PR14 preview JS parts

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/_fix/PR14"
      - ".github/workflows/materialize-pr14.yml"

permissions:
  contents: write

concurrency:
  group: materialize-pr14
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble wheel data URIs and split JS parts
        run: |
          python3 << 'PY'
          import base64, hashlib, json, pathlib

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()

          meta = json.loads(pathlib.Path("assets/_fix/pr14-meta.json").read_text())
          src = bytearray()
          for item in meta["src"]:
              path = pathlib.Path("assets/_src") / item["name"]
              data = path.read_bytes()
              sha = blob_sha(data)
              if len(data) != item["size"] or sha != item["sha"]:
                  raise SystemExit(f"src mismatch {item['name']} size={len(data)} sha={sha} want {item['size']} {item['sha']}")
              src.extend(data)
          js = bytes(src)
          if not js.startswith(b"var __W={};"):
              raise SystemExit("patched JS missing __W placeholder")

          wheels = {}
          for item in meta["hex"]:
              path = pathlib.Path("assets/_hex/wheels") / item["name"]
              stored = path.read_bytes()
              text = stored.decode("ascii").strip().lower()
              sha = blob_sha(stored)
              sha2 = blob_sha(text.encode("ascii"))
              if sha != item["sha"] and sha2 != item["sha"]:
                  raise SystemExit(f"hex mismatch {item['name']} sha={sha}/{sha2} want {item['sha']}")
              wheels.setdefault(item["stem"], []).append((item["idx"], text))

          mapping = {}
          for stem, chunks in wheels.items():
              chunks.sort()
              hx = "".join(ch for _, ch in chunks)
              raw = bytes.fromhex(hx)
              want = meta["webp_sha1"][stem]
              got = hashlib.sha1(raw).hexdigest()
              if got != want:
                  raise SystemExit(f"webp sha mismatch {stem} {got} want {want} size={len(raw)}")
              mapping[stem] = "data:image/webp;base64," + base64.b64encode(raw).decode("ascii")
              print("wheel", stem, len(raw))

          if set(mapping) != set(meta["webp_sha1"]):
              raise SystemExit(f"wheel set mismatch {sorted(mapping)} vs {sorted(meta['webp_sha1'])}")

          entries = ",".join(f"{json.dumps(k)}:{json.dumps(v)}" for k, v in mapping.items())
          prefix = f"var __W={{{entries}}};".encode("ascii")
          out = prefix + js[len(b"var __W={};"):]
          print("final js", len(out))

          part = 25600
          n = (len(out) + part - 1) // part
          assets = pathlib.Path("assets")
          written = []
          for i in range(n):
              chunk = out[i * part:(i + 1) * part]
              dest = assets / f"index-BXAnjkA5.part{i}"
              dest.write_bytes(chunk)
              written.append((dest.name, len(chunk), blob_sha(chunk)))
              print("part", dest.name, len(chunk), written[-1][2])
          pathlib.Path("assets/_fix/pr14-parts.json").write_text(json.dumps({"count": n, "bytes": len(out), "parts": written}, indent=2) + "\n")
          PY
      - name: Commit materialized JS parts only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-BXAnjkA5.part* assets/_fix/pr14-parts.json
          if git diff --cached --quiet; then
            echo "parts already current"
          else
            git commit -m "Materialize PR14 inlined-wheel JS parts (index-BXAnjkA5)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
