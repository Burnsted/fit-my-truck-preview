name: assemble-preview-assets
on:
  push:
    paths:
      - 'assets/.assemble/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and write tip assets
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          css_parts = sorted(Path('assets/.assemble/css').glob('c*.txt'))
          js_parts = sorted(Path('assets/.assemble/js').glob('j*.txt'))
          assert css_parts and js_parts, (css_parts, js_parts)
          css = ''.join(p.read_text() for p in css_parts)
          js = ''.join(p.read_text() for p in js_parts)
          Path('assets/index-dBAxvxre.css').write_text(css)
          Path('assets/index-qJlZHThm.js').write_text(js)
          assert 'overflow-x:clip' in css and 'consent-notice-bar' in css
          assert 'fmtPortal' in js and 'home-choice-fleet' in js and 'fleetfit-result-cta' in js
          print('css', len(css), 'js', len(js))
          PY
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-dBAxvxre.css assets/index-qJlZHThm.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(consent): portal usage bar onto YjYaDdGR FleetFit+feedback tip"
          git push
