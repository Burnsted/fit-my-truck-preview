name: assemble-preview-assets
on:
  push:
    paths:
      - 'assets/.assemble/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib+b64 tip assets
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib, re
          from pathlib import Path
          def clean(s):
              return re.sub(r'\s+', '', s)
          css_parts = sorted(Path('assets/.assemble/cssb').glob('css_p*.b64'))
          p_parts = sorted(Path('assets/.assemble/jsz').glob('js_p0[0-3].b64'))
          q_parts = sorted(Path('assets/.assemble/jsz').glob('js_q*.b64'))
          js_parts = p_parts + q_parts
          assert css_parts and len(p_parts)==4 and q_parts, (css_parts, p_parts, q_parts)
          css_b64 = ''.join(clean(p.read_text()) for p in css_parts)
          js_b64 = ''.join(clean(p.read_text()) for p in js_parts)
          repairs = [
            ('GjIo'+'ihFJ6', 'GjIo'+'ohFJ6'),
            ('Qpaw0/g'+'omLOe2', 'Qpaw0/m'+'omLOe2'),
            ('EyabX'+'ZaL8lH5', 'EyabX'+'RaL8lH5'),
            ('epJ3RM'+'9yqhXha', 'epJ3RM'+'1yqhXha'),
            ('i5p1P2'+'28JmfZt', 'i5p1P2'+'88JmfZt'),
          ]
          for a,b in repairs:
              js_b64 = js_b64.replace(a,b)
          css = zlib.decompress(base64.b64decode(css_b64)).decode()
          js = zlib.decompress(base64.b64decode(js_b64)).decode()
          Path('assets/index-dBAxvxre.css').write_text(css)
          Path('assets/index-qJlZHThm.js').write_text(js)
          assert 'overflow-x:clip' in css and 'consent-notice-bar' in css
          assert 'fmtPortal' in js and 'home-choice-fleet' in js and 'fleetfit-result-cta' in js
          print('css', len(css), 'js', len(js), 'js_parts', len(js_parts))
          PY
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-dBAxvxre.css assets/index-qJlZHThm.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(consent): portal usage bar onto YjYaDdGR FleetFit+feedback tip"
          git push
