name: assemble-preview-assets
on:
  push:
    paths:
      - 'assets/.assemble/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tip assets from YjYaDdGR / DyqnMpUR
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          doc = json.loads(Path('assets/.assemble/tip-patches.json').read_text())
          def apply(base_path, patches):
              data = bytearray(Path(base_path).read_bytes())
              # apply from end so earlier offsets stay valid
              for i1, i2, b64 in sorted(patches, key=lambda p: p[0], reverse=True):
                  rep = base64.b64decode(b64) if b64 else b''
                  data[i1:i2] = rep
              return bytes(data)
          js = apply(doc['js_base'], doc['js_patches'])
          css = apply(doc['css_base'], doc['css_patches'])
          assert hashlib.sha256(js).hexdigest() == doc['js_sha256'], hashlib.sha256(js).hexdigest()
          assert hashlib.sha256(css).hexdigest() == doc['css_sha256'], hashlib.sha256(css).hexdigest()
          js_text = js.decode()
          css_text = css.decode()
          assert 'fmtPortal' in js_text and 'home-choice-fleet' in js_text and 'fleetfit-result-cta' in js_text
          assert 'overflow-x:clip' in css_text and 'consent-notice-bar' in css_text
          Path(doc['js_out']).write_bytes(js)
          Path(doc['css_out']).write_bytes(css)
          print('js', len(js), 'css', len(css))
          PY
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index-dBAxvxre.css assets/index-qJlZHThm.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix(consent): portal usage bar onto YjYaDdGR FleetFit+feedback tip"
          git push
