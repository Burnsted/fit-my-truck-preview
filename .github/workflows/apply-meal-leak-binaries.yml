name: Apply meal-leak binary fixes
on:
  push:
    branches: [cursor/strip-meal-leak-assets-3223]
    paths:
      - "assets/*.jpg.b64"
      - "assets/*.jpg.b64.part*"
      - "assets/_b64_chunks/**"
      - "assets/*.svg"
      - ".github/workflows/apply-meal-leak-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/strip-meal-leak-assets-3223
      - name: Assemble woodwork + GC JPGs from zlib.b64 chunks
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, zlib, re
          from pathlib import Path

          chunks = Path("assets/_b64_chunks")
          EXPECTED = {
              "home-workday-woodwork-Dev4WPAv.jpg": "ec87762a5018f982b7144fcad7909b9f",
              "workday-trade-general-contractor-01Q32nWx.jpg": "394dbbfbbd8ab19c4e6306bf53224e69",
          }

          def list_zlib_chunks(prefix: str):
              # Prefer complete two-digit sets (gc_00..gc_33, wood_00..wood_98)
              # over partial three-digit wood_000.. uploads left as orphans.
              allp = [
                  p for p in sorted(chunks.glob(f"{prefix}_*.zlib.b64"))
                  if re.fullmatch(rf"{prefix}_\d+\.zlib\.b64", p.name)
              ]
              by_width = {}
              for p in allp:
                  m = re.fullmatch(rf"{prefix}_(\d+)\.zlib\.b64", p.name)
                  by_width.setdefault(len(m.group(1)), []).append(p)
              if not by_width:
                  return []
              two = sorted(by_width.get(2, []))
              if len(two) >= 30:
                  return two
              return sorted(max(by_width.values(), key=len))

          def load_zlib_b64_chunk(p: Path) -> str:
              # Chunks may be raw zlib.b64 ASCII, or hex-encoded ASCII (MCP-safe transport).
              raw = p.read_text().strip()
              if re.fullmatch(r"[0-9a-fA-F]+", raw) and len(raw) % 2 == 0:
                  raw = bytes.fromhex(raw).decode("ascii")
              return raw

          def assemble_from_zlib_chunks(prefix: str) -> bytes:
              zparts = list_zlib_chunks(prefix)
              if not zparts:
                  raise SystemExit(f"missing zlib chunks for {prefix}")
              text = "".join(
                  zlib.decompress(base64.b64decode(load_zlib_b64_chunk(p))).decode("ascii")
                  for p in zparts
              )
              data = base64.b64decode(text)
              print(f"assembled {prefix} from {len(zparts)} zlib chunks; b64_chars={len(text)}")
              return data

          def write_binary(rel_name: str, data: bytes) -> None:
              md5 = hashlib.md5(data).hexdigest()
              expected = EXPECTED[rel_name]
              if md5 != expected:
                  raise SystemExit(f"md5 mismatch {rel_name}: {md5} != {expected}")
              rel = Path("assets") / rel_name
              rel.write_bytes(data)
              b64_path = Path("assets") / f"{rel_name}.b64"
              b64_path.write_text(base64.b64encode(data).decode("ascii"))
              for staging in ("staging-simplify", "staging-feedback"):
                  staged = Path(staging) / "assets" / rel_name
                  if staged.parent.is_dir():
                      staged.write_bytes(data)
                      print("mirrored", staged)
              print(rel, len(data), md5)

          # Prefer in-repo zlib chunks over cross-repo fetch
          write_binary("home-workday-woodwork-Dev4WPAv.jpg", assemble_from_zlib_chunks("wood"))
          write_binary("workday-trade-general-contractor-01Q32nWx.jpg", assemble_from_zlib_chunks("gc"))
          PY
      - name: Keep YjYaDdGR FleetFit CTA; point GC card at clean SVG
        run: |
          python3 <<'PY'
          from pathlib import Path
          js = Path("assets/index-YjYaDdGR.js")
          text = js.read_text()
          assert "fleetfit" in text.lower(), "FleetFit CTA missing before patch"
          old = "workday-trade-general-contractor-01Q32nWx.jpg"
          new = "workday-trade-general-contractor.svg"
          if old in text:
              text = text.replace(old, new, 1)
              print("patched GC URL to SVG")
          elif new in text:
              print("GC already on SVG")
          else:
              raise SystemExit("could not find GC image ref to patch")
          assert "home-workday-woodwork-Dev4WPAv.jpg" in text, "woodwork hashed ref must stay"
          assert "fleetfit" in text.lower(), "FleetFit CTA missing after patch"
          js.write_text(text)
          print("FleetFit CTA preserved")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(assets): apply meal-free woodwork + GC binaries (keep YjYaDdGR FleetFit CTA)"
            git push
          fi
